name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/VolleyballTeam.Web/package-lock.json

      - name: Install front-end tooling
        working-directory: src/VolleyballTeam.Web
        run: npm ci

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Publish
        run: dotnet publish src/VolleyballTeam.Web --configuration Release --output ./publish

      - name: Build migration bundle
        run: >-
          dotnet ef migrations bundle
          --project src/VolleyballTeam.Infrastructure
          --startup-project src/VolleyballTeam.Web
          --configuration Release
          --output ./efbundle
          --force

      - name: Apply database migrations
        env:
          SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: ./efbundle --connection "$SQL_CONNECTION_STRING"

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
